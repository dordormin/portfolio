server {
    listen 80;
    
    # Serve static assets efficiently, including WebGL/WASM if present
    gzip on;
    gzip_types application/javascript application/wasm text/css text/plain;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}

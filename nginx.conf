server {
    listen 80;

    # Serve static assets efficiently, including WebGL/WASM if present
    gzip on;
    gzip_types application/javascript application/wasm text/css text/plain;

    # --- Security headers (security audit 2026-10-11, H-02) ---
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Strict CSP: all assets are served locally, no external scripts/styles/fonts.
    # style-src 'unsafe-inline' is required by Tailwind/inline styles.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # --- Block dotfiles (security audit 2026-10-11, M-05) ---
    # The SPA fallback (try_files ... /index.html) used to return 200 for
    # /.env, /.git/HEAD, /admin, etc. Fail closed instead.
    location ~ /\. {
        return 404;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}
